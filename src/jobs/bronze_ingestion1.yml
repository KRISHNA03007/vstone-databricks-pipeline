resources:
  jobs:
    bronze_ingestion_chunk1:
      name: "Day 2 - Bronze Layer Ingestion (Chunk 1)"
      tasks:
        - task_key: "copy_into_bronze_chunk1"
          notebook_task:
            # Path is RELATIVE to this file's own location (src/jobs/), not a
            # hardcoded absolute workspace path. DABs automatically syncs the
            # notebook and rewrites this into the correct deployed path for
            # whichever user/service-principal runs "databricks bundle deploy" -
            # so this keeps working no matter whose Databricks account deploys it.
            notebook_path: ../notebooks/bronze/01_chunk1_initial.ipynb
            base_parameters:
              source_path: "/Volumes/vstone/landing/raw_data/chunks/chunk1_initial.csv.gz"
              catalog: "vstone"
              schema: "bronze"
              table_name: "transactions1"