resources:
  jobs:
    bronze_sanity_chunk3:
      name: bronze_sanity_chunk3

      tasks:
        - task_key: run_all_tests

          spark_python_task:
            python_file: ../../tests/run_tests.py

            parameters:
              - "--source-path"
              - "${var.chunk3_source_path}"

              - "--table-name"
              - "${var.catalog}.${var.bronze_schema}.${var.chunk3_table_name}"

              - "--format"
              - "json"