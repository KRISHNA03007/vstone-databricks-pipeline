resources:
  jobs:
    bronze_sanity_chunk1:
      name: bronze_sanity_chunk1

      tasks:
        - task_key: run_all_tests

          spark_python_task:
            python_file: run_tests.py

            parameters:
              - "--source-path"
              - "${var.chunk1_source_path}"

              - "--table-name"
              - "${var.catalog}.${var.bronze_schema}.${var.chunk1_table_name}"

              - "--format"
              - "csv"