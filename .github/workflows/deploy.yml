name: CI-CD Databricks Asset Bundles

on:
  pull_request:
    branches:
      - 'dev'
      - 'main'
  push:
    branches:
      - 'dev'
      - 'main'

jobs:
  # -------------------------------------------------------------
  # Step 1: Run Tests First (Fastest fail-early step)
  # -------------------------------------------------------------
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Speeds up runs by caching downloaded wheels

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest databricks-sql-connector

      - name: Run Pytest Suite
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
        run: pytest tests/ -v

  # -------------------------------------------------------------
  # Step 2: Validate Bundle (Runs strictly after tests pass)
  # -------------------------------------------------------------
  validate-bundle:
    needs: run-tests
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate Databricks Bundle
        run: databricks bundle validate -t dev

  # -------------------------------------------------------------
  # Step 3: Deploy & Execute Ingestion (Only on merge/push to dev/main)
  # -------------------------------------------------------------
  deploy-and-run:
    needs: validate-bundle
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy Databricks Bundle
        run: databricks bundle deploy -t dev

      - name: Run Ingestion Pipeline Job
        run: databricks bundle run bronze_ingestion_chunk1 -t dev