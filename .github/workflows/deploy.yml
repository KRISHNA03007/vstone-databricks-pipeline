name: CI-CD Databricks Asset Bundles

on:
  pull_request:
    branches:
      - 'dev'
      - 'main'
  push:
    branches:
      - 'dev'
      - 'main'

jobs:
  validate-deploy-and-test:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

     - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest databricks-sql-connector

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      # Validation runs on both PRs and merges
      - name: Validate Databricks Bundle
        run: databricks bundle validate

      # Deploy bundle upon merge to dev/main
      - name: Deploy Databricks Bundle
        if: github.event_name == 'push'
        run: databricks bundle deploy -t dev

      # Execute the ingestion pipeline
      - name: Run Ingestion Pipeline Job
        if: github.event_name == 'push'
        run: databricks bundle run bronze_ingestion_chunk1 -t dev

      # Automatically finds and runs ALL test_*.py files inside the tests/ directory
      - name: Run All Tests in tests folder
        if: github.event_name == 'push'
        run: pytest tests/ -v