name: CI-CD Databricks Asset Bundles

on:
  pull_request:
    branches:
      - 'dev'
      - 'main'
  push:
    branches:
      - 'dev'
      - 'main'

jobs:
  # -------------------------------------------------------------
  # Step 1: Run Tests First (Fastest fail-early step)
  # -------------------------------------------------------------
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Speeds up runs by caching downloaded wheels, keyed off requirements.txt below
          cache-dependency-path: 'requirements.txt'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          # pytest: test runner. pyspark: required by the local unit tests
          # (test_*_unit.py) which exercise notebook functions against small
          # in-memory DataFrames using assertDataFrameEqual/assertSchemaEqual.
          # databricks-sql-connector: required by the integration tests that
          # hit a live SQL warehouse. See requirements.txt for pinned versions.
          pip install -r requirements.txt

      - name: Run Unit Tests (offline, no Databricks secrets required)
        run: pytest tests/ -v -k "unit"

      - name: Run Integration Tests (requires live Databricks SQL warehouse)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
        run: pytest tests/ -v -k "not unit"

  # -------------------------------------------------------------
  # Step 2: Validate Bundle (Runs strictly after tests pass)
  # -------------------------------------------------------------
  validate-bundle:
    needs: run-tests
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate Databricks Bundle
        run: databricks bundle validate -t dev

  # -------------------------------------------------------------
  # Step 3: Deploy & Execute Ingestion (Only on merge/push to dev/main)
  # -------------------------------------------------------------
  deploy-and-run:
    needs: validate-bundle
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy Databricks Bundle
        run: databricks bundle deploy -t dev

      - name: Run Ingestion Pipeline Job
        run: databricks bundle run bronze_ingestion_chunk1 -t dev